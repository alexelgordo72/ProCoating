<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO-Coating Treatments Inc. - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #003b6f 0%, #0a2b4e 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-container { background: white; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 420px; box-shadow: 0 20px 45px rgba(0,0,0,0.28); border-top: 5px solid #9ec63b; }
        .logo { text-align: center; margin-bottom: 26px; }
        .logo img { max-width: 270px; width: 100%; height: auto; margin-bottom: 8px; }
        .logo small { display: block; color: #555; font-size: 0.85rem; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 7px; font-weight: bold; color: #0a2b4e; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cfd8dc; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: #005596; box-shadow: 0 0 0 3px rgba(0,85,150,0.12); }
        .btn { width: 100%; padding: 13px; background: #005596; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #003f70; }
        .error { background: #ffe0e0; color: #c0392b; padding: 10px; border-radius: 8px; margin-bottom: 18px; text-align: center; display: none; font-size: 0.9rem; }
        .footer-note { text-align: center; margin-top: 22px; font-size: 0.78rem; color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="/assets/logo-procoating.png" alt="PRO-Coating Treatments Inc.">
            <small>Operations, Equipment Rental & Service Management</small>
        </div>
        <div id="errorMsg" class="error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <div class="footer-note">PRO-Coating Treatments Inc. &copy; 2026</div>
    </div>
    <script>
        const API_BASE = '/api';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('errorMsg');
            errDiv.style.display = 'none';
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Invalid credentials');
                window.location.href = '/index.html';
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
