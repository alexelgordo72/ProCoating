<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO-Coating Treatments Inc. - Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="header">
        <div class="logo" style="display:flex;align-items:center;gap:12px;"><div style="background:#ffffff;padding:4px 10px;border-radius:8px;display:flex;align-items:center;"><img src="/assets/logo-procoating.png" alt="PRO-Coating Treatments Inc." style="height:36px;width:auto;"></div><div><small style="display:block;color:#e0e6ed;font-size:0.75rem;">Equipment Rental &amp; Service 24/7</small></div></div>
        <div class="user-info">
            <button id="darkModeToggle" style="background:none; border:none; cursor:pointer; font-size:1.2rem; color:white;">🌙</button>
            <div class="notification-bell" onclick="toggleNotifications()">
                🔔
                <span id="notificationBadge" class="notification-badge">0</span>
            </div>
            <span id="userName"></span>
            <span id="userRole" style="background:#e67e22; padding:3px 8px; border-radius:12px; font-size:0.7rem;"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    </div>
    <div class="sidebar" id="sidebar">
        <a onclick="loadPage('dashboard')">📊 Dashboard</a>
        <a onclick="loadPage('customers')">👥 Customers</a>
        <a onclick="loadPage('equipment')">❄️ Equipment</a>
        <a onclick="loadPage('rentals')">📄 Rentals</a>
        <a onclick="loadPage('workorders')">🔧 Work Orders</a>
        <a onclick="loadPage('inventory')">📦 Inventory</a>
        <a onclick="loadPage('purchaseorders')">📋 Purchase Orders</a>
        <a onclick="loadPage('reports')">📊 Reports</a>
        <a onclick="loadPage('backup')">💾 Backup</a>
        <a onclick="loadPage('audit')">📋 Audit Logs</a>
        <a href="/api-docs" target="_blank">📚 API Docs</a>
    </div>
    <div class="main" id="mainContent">Loading...</div>

    <div id="notificationsModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <span class="close" onclick="closeModal('notificationsModal')">&times;</span>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>🔔 Notifications</h3>
                <button class="btn-secondary" onclick="markAllNotificationsRead()" style="font-size:12px; padding:5px 10px;">Mark all as read</button>
            </div>
            <div id="notificationsList" style="margin-top:1rem; max-height:400px; overflow-y:auto;"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/customers.js"></script>
    <script src="/js/equipment.js"></script>
    <script src="/js/rentals.js"></script>
    <script src="/js/workorders.js"></script>
    <script src="/js/inventory.js"></script>
    <script src="/js/purchaseorders.js"></script>
    <script src="/js/reports.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/audit.js"></script>
<script src="js/customer-contacts.js"></script>
<script src="js/operations-lifecycle.js"></script>
<script src="js/inventory-labels.js"></script>
</body>
</html>
